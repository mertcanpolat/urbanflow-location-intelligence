name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: urbanflow_test
      DB_USER: urbanflow_test_user
      DB_PASSWORD: urbanflow_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v